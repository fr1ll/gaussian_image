[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussian_image"
version = "0.1.0"
dependencies = [
        "constriction",
        "gsplat",
        "numpy",
        "pandas",
        "pillow",
        "pytorch-msssim",
        "PyYAML",
        "torch",
        "tqdm",
        "vector-quantize-pytorch",
]

[tool.setuptools.packages.find]
where = ["."]


[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
gsplat = [
  { git = "https://github.com/XingtongGe/gsplat" },
]


[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
